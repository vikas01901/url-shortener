# Runs the service against PostgreSQL. Local-only credentials; never reuse them.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/shortener
      DB_USERNAME: shortener
      DB_PASSWORD: shortener
    ports:
      - "8080:8080"
