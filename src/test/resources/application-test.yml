spring:
  datasource:
    url: jdbc:h2:mem:shortener;DB_CLOSE_DELAY=-1

app:
  analytics:
    # Record clicks on the request thread so assertions on counts are deterministic.
    async: false
  rate-limit:
    # Effectively unlimited; RateLimitIntegrationTest overrides this.
    capacity: 100000
    refill-per-minute: 100000
