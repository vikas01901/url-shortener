openapi: 3.0.3
info:
  title: URL Shortener API
  version: 1.0.0
  description: >
    Create short links, redirect to the original URL, and read click analytics.
    The running service also publishes a generated specification at /v3/api-docs.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/links:
    post:
      summary: Create a short link
      operationId: createLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLinkRequest"
            examples:
              generated:
                value: { url: "https://example.com/some/long/path" }
              aliasWithTtl:
                value: { url: "https://example.com/sale", alias: "spring-sale", ttlSeconds: 3600 }
      responses:
        "201":
          description: Link created
          headers:
            Location:
              description: URL of the link resource
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Link"
        "400":
          description: Invalid URL, alias or TTL, or malformed body
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The alias is already in use
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Rate limit exceeded
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema: { type: integer }
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: A unique code could not be allocated; retry
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /{code}:
    get:
      summary: Redirect to the original URL
      operationId: redirect
      parameters:
        - $ref: "#/components/parameters/Code"
        - name: Referer
          in: header
          required: false
          description: Only the host is recorded
          schema: { type: string }
      responses:
        "302":
          description: Redirect
          headers:
            Location:
              schema: { type: string, format: uri }
            Cache-Control:
              schema: { type: string, example: no-store }
        "404":
          description: Unknown code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          description: The link has expired
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/links/{code}:
    get:
      summary: Get link metadata
      operationId: getLink
      parameters:
        - $ref: "#/components/parameters/Code"
      responses:
        "200":
          description: The link. Expired links remain readable until purged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Link"
        "404":
          description: Unknown code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/links/{code}/stats:
    get:
      summary: Get click analytics for a link
      operationId: getStats
      parameters:
        - $ref: "#/components/parameters/Code"
        - name: days
          in: query
          required: false
          description: Trailing window in UTC days. Values outside 1..365 are clamped.
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
        "404":
          description: Unknown code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  parameters:
    Code:
      name: code
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{4,32}$"
  schemas:
    CreateLinkRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          maxLength: 2048
          description: http or https URL with a public host and no embedded credentials
        alias:
          type: string
          pattern: "^[A-Za-z0-9_-]{4,32}$"
          description: Optional caller-chosen code. Reserved words are rejected.
        ttlSeconds:
          type: integer
          format: int64
          minimum: 60
          maximum: 31536000
          description: Optional lifetime. Omit for the server default (no expiry unless configured).
    Link:
      type: object
      properties:
        code: { type: string }
        shortUrl: { type: string, format: uri }
        originalUrl: { type: string, format: uri }
        customAlias: { type: boolean }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
    Stats:
      type: object
      properties:
        code: { type: string }
        originalUrl: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        totalClicks:
          type: integer
          format: int64
          description: All-time count
        lastAccessedAt: { type: string, format: date-time, nullable: true }
        windowDays: { type: integer }
        clicksByDay:
          type: array
          description: Newest first; days with no clicks are omitted
          items:
            type: object
            properties:
              day: { type: string, format: date }
              clicks: { type: integer, format: int64 }
        topReferrers:
          type: array
          description: Up to five referring hosts, busiest first
          items:
            type: object
            properties:
              host: { type: string }
              clicks: { type: integer, format: int64 }
    Problem:
      type: object
      description: RFC 7807 problem details
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: object
          description: Field name to message, present on validation failures
          additionalProperties: { type: string }
